name: Deploy BLCKCHAT site and experimental SMS APK
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'android/**'
      - 'src/blckui.c'
      - 'include/blckui.h'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build SMS-first experimental APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug
      - name: Verify and stage experimental build
        run: |
          set -euo pipefail
          APK="android/build/outputs/apk/debug/android-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          mkdir -p site/downloads
          cp "$APK" site/downloads/blckchat-sms-experimental.apk
          (cd site/downloads && sha256sum blckchat-sms-experimental.apk > SHA256SUMS.txt)
          test -s site/downloads/blckchat-sms-experimental.apk
      - name: Verify SMS app requests no network or SMS permissions
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions site/downloads/blckchat-sms-experimental.apk > /tmp/blckchat-perms.txt
          if grep -E 'android.permission.(INTERNET|SEND_SMS|READ_SMS|RECEIVE_SMS)' /tmp/blckchat-perms.txt; then
            echo "Refusing to publish over-permissioned SMS alpha" >&2
            exit 1
          fi
          "$AAPT" dump badging site/downloads/blckchat-sms-experimental.apk | grep -F "com.blckswan.blckchat.RemoteSmsActivity"
      - uses: actions/configure-pages@v5
      - name: Upload site and verified experimental APK
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
