name: Android Keystore + JNI emulator test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/src/androidTest/**'
      - 'android/src/main/**'
      - 'android/build.gradle'
      - '.github/workflows/android-emulator.yml'
permissions:
  contents: read
concurrency:
  group: sms-emulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK/NDK build requirements
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android 15 smoke tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            gradle --no-daemon :android:connectedDebugAndroidTest --stacktrace
            mkdir -p android/build/ui-capture
            adb shell am start -n com.blckswan.blckchat.debug/com.blckswan.blckchat.RemoteSmsActivity
            sleep 3
            adb exec-out screencap -p > android/build/ui-capture/sms-alpha-onboarding.png
            test -s android/build/ui-capture/sms-alpha-onboarding.png
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blckchat-android-emulator-reports
          path: |
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
            android/build/ui-capture/
          if-no-files-found: ignore
          retention-days: 14
