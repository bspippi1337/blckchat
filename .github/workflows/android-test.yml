name: Android SMS E2EE experimental APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'include/blckui.h'
      - 'src/blckui.c'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-test.yml'
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and NDK
        run: |
          echo "SDK root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Assemble remote SMS experimental APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug
      - name: Save installable experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: blckchat-sms-experimental-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
